services:
  - type: web
    name: orgintel-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ORIGINS
        value: "https://sriyukthach.github.io,http://localhost:5173,http://localhost:8000"
      - key: CACHE_ENABLED
        value: "true"
      - key: CACHE_TTL_HOURS
        value: "48"
      - key: LLM_PROVIDER
        value: mock
      - key: GROQ_API_KEY
        sync: false
